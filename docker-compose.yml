name: hookrelay

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-hookrelay}
      POSTGRES_USER: ${DB_USER:-hookrelay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hookrelay}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hookrelay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hookrelay}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: hookrelay:local
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hookrelay}
      DB_USER: ${DB_USER:-hookrelay}
      DB_PASSWORD: ${DB_PASSWORD:-hookrelay}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-hookrelay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-hookrelay}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  webhook-sink:
    profiles: ["sink"]
    image: python:3.12-alpine
    command: ["python", "/app/webhook-sink.py"]
    environment:
      PORT: 8080
    ports:
      - "${SINK_PORT:-8090}:8080"
    volumes:
      - ./scripts/webhook-sink.py:/app/webhook-sink.py:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/received || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  postgres-data:
  rabbitmq-data:
