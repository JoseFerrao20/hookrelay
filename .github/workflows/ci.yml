name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew spotlessCheck
      - name: Build and test
        run: ./gradlew build
      - name: Build Docker image
        run: docker build -t hookrelay:ci .
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          HOOKRELAY_RETRY_INITIAL_DELAY: 1s
          HOOKRELAY_RETRY_MAX_DELAY: 5s
          HOOKRELAY_RETRY_JITTER: "0"
        run: docker compose --profile app --profile sink up -d --build --wait
      - name: Smoke test
        run: scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app --profile sink logs
      - name: Stop stack
        if: always()
        run: docker compose --profile app --profile sink down -v
